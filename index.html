<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>引っ越しました｜さくらツール（旧 さくら先生の座席表）</title>
<meta name="robots" content="noindex">
<!-- 🔴 新しいサイトが本物であることをGoogleに伝える -->
<link rel="canonical" href="https://sakura-tools.com/">
<!-- 🔴 3秒後に自動で移動。⚠GitHub Pages では正式な301が出せないので、これが代わり -->
<meta http-equiv="refresh" content="3;url=https://sakura-tools.com/">
<style>
  :root{
    --pink:#c86a8e; --pink-pale:#fbf1f4;
    --ink:#2c2e30; --ink-soft:#82868c; --line:#e3e5e8; --bg:#f8f9fa;
    color-scheme: light;
  }
  *{box-sizing:border-box}
  body{
    margin:0; padding:0; min-height:100vh;
    display:flex; align-items:center; justify-content:center;
    font-family:"Hiragino Kaku Gothic ProN","Yu Gothic","Meiryo",sans-serif;
    color:var(--ink); background:var(--bg); line-height:1.8;
  }
  .box{
    background:#fff; border:1px solid var(--line); border-radius:14px;
    padding:36px 28px; margin:20px; max-width:520px; text-align:center;
  }
  .mark{font-size:2rem}
  h1{font-size:1.3rem; margin:10px 0 6px}
  h1 .en{letter-spacing:.06em}
  .sub{color:var(--ink-soft); font-size:.8rem; letter-spacing:.12em; margin:0 0 22px}
  p{margin:0 0 16px; font-size:.95rem}
  .old{color:var(--ink-soft); font-size:.88rem}
  .go{
    display:inline-block; margin-top:10px;
    background:var(--pink); color:#fff; text-decoration:none;
    font-size:1.05rem; font-weight:bold; padding:14px 30px; border-radius:999px;
    box-shadow:0 3px 10px rgba(0,0,0,.18), 0 1px 2px rgba(0,0,0,.10);
  }
  .go:hover{filter:brightness(1.04)}
  .auto{margin-top:20px; font-size:.82rem; color:var(--ink-soft)}
  .list{
    margin:22px 0 0; padding:16px 0 0; border-top:1px solid var(--line);
    font-size:.88rem; color:var(--ink-soft);
  }
  .list a{color:var(--pink)}
</style>
</head>
<body>
  <div class="box">
    <div class="mark">🌸</div>
    <h1><span class="en">SAKURA TOOLS</span></h1>
    <p class="sub">さくらツール</p>

    <p><strong>サイトのお引っ越しをしました。</strong><br>
      新しいアドレスは <strong>sakura-tools.com</strong> です。</p>

    <p class="old">旧アドレス： sakura-teachers.com</p>

    <a class="go" href="https://sakura-tools.com/">新しいサイトへ →</a>

    <p class="auto">3秒たつと、自動で新しいサイトに移ります。</p>

    <div class="list">
      よく使われるページ<br>
      <a href="https://sakura-tools.com/seat/">座席表メーカー</a>　／　
      <a href="https://sakura-tools.com/seki/">席次表メーカー</a>
    </div>
  </div>
</body>
</html>
